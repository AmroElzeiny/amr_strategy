[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-orchestrator"
version = "1.0.0"
description = "HM_CRYPTO_V1 runtime orchestration across market, strategy, and risk/execution authorities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "crypto-market-intel==1.0.0",
  "crypto-strategy-engine==1.0.0",
  "crypto-risk-execution==0.3.0.dev0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.20"]

[project.scripts]
crypto-trading-orchestrator = "crypto_trading_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
follow_imports = "skip"
packages = ["crypto_trading_orchestrator"]
