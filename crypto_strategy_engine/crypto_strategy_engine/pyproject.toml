[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-strategy-engine"
version = "1.0.0"
description = "Standalone deterministic crypto strategy authority with advisory AI gate and walk-forward research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.20"]

[project.scripts]
crypto-strategy-engine = "crypto_strategy_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.setuptools.package-data]
crypto_strategy_engine = ["contracts/*.json", "contracts/*.md"]
